<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Nova OT · NIU Estoque</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --surface2:var(--surface-2); --r:14px;
}
*{margin:0;padding:0}
body{font-size:14.5px;min-height:100vh;padding:0 0 80px}
header{background:var(--surface-2);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
header a{text-decoration:none;display:flex;align-items:center;gap:10px}
.page{max-width:700px;margin:0 auto;padding:20px 16px}
.section-label{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-card)}
label{font-size:.74rem;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
select option{background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:.88rem;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#4c6ef5);color:#fff;box-shadow:0 4px 16px rgba(91,140,255,.25)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface)}
.tema-header{display:flex;align-items:center;gap:8px;padding:14px 2px 8px;margin-top:4px;border-top:1px solid var(--border);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--primary)}
.tema-header:first-child{border-top:none;margin-top:0}
.tema-count{font-weight:600;font-size:.7rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;text-transform:none;letter-spacing:0}
.tema-add-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--primary);font-weight:700;font-size:.72rem;padding:4px 10px;border-radius:8px;cursor:pointer;text-transform:none;letter-spacing:0}
.tema-add-btn:hover{background:var(--surface-hover)}
.tema-body{min-height:6px}
.tema-vazio-hint{text-align:center;padding:16px;margin-bottom:12px;color:var(--muted);font-size:.82rem;background:var(--surface);border:1.5px dashed var(--border);border-radius:12px}
.tema-ativo-chip{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;color:var(--primary);background:rgba(91,140,255,.1);border:1px solid rgba(91,140,255,.3);border-radius:20px;padding:5px 6px 5px 12px;margin-bottom:10px}
.tema-ativo-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:.8rem;padding:2px 6px;border-radius:50%}
.tema-ativo-chip button:hover{background:rgba(91,140,255,.18)}
.canal-feed{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;padding-right:2px}
.canal-item{display:flex;gap:10px;font-size:.84rem;line-height:1.4}
.canal-avatar{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;color:var(--primary);flex-shrink:0}
.canal-item.evento{color:var(--muted);font-size:.78rem;align-items:center}
.canal-item.evento .canal-avatar{width:20px;height:20px;background:none;border:none;color:var(--muted-2)}
.canal-item.mensagem .canal-bubble{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;flex:1}
.canal-autor{font-weight:800;color:var(--text);margin-right:6px}
.canal-hora{color:var(--muted);font-size:.72rem;font-weight:500}
.canal-compose{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--border);padding-top:12px}
.canal-compose textarea{resize:none;min-height:40px}
.item-row{cursor:grab}
.item-row:active{cursor:grabbing}
.item-row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;position:relative}
.item-row.estoque-item{border-color:rgba(91,140,255,.4);background:linear-gradient(135deg,rgba(91,140,255,.04),var(--surface))}
.item-row.extra-item{border-color:rgba(251,191,36,.3);background:linear-gradient(135deg,rgba(251,191,36,.04),var(--surface))}
.item-row-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.item-icon{width:40px;height:40px;border-radius:11px;background:rgba(91,140,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.item-icon.extra{background:rgba(251,191,36,.12)}
.item-nome-display{font-weight:800;font-size:.95rem;margin-bottom:3px}
.item-badge{font-size:.68rem;color:var(--primary);font-weight:700}
.remove-btn{position:absolute;top:14px;right:14px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.78rem;padding:4px 9px;border-radius:8px;transition:.15s}
.remove-btn:hover{color:var(--danger);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.item-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* a linha inteira é draggable="true" (arrastar item pra outro tema) — sem isso, tentar
   selecionar texto com o mouse dentro dos campos dispara o arrasto da linha em vez de
   selecionar o texto */
.item-fields input,.item-fields select,.item-fields textarea{-webkit-user-drag:none;user-select:text}
.tag-estoque{display:inline-flex;align-items:center;background:rgba(91,140,255,.12);color:var(--primary);font-size:.62rem;font-weight:800;padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle;border:1px solid rgba(91,140,255,.2)}
.tag-extra{display:inline-flex;align-items:center;background:rgba(251,191,36,.1);color:var(--warn);font-size:.62rem;font-weight:800;padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle;border:1px solid rgba(251,191,36,.2)}
.search-wrap{position:relative;margin-bottom:10px}
.search-results{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-top:4px;max-height:220px;overflow-y:auto;display:none;position:absolute;width:100%;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.search-result-item{padding:11px 14px;cursor:pointer;font-size:.88rem;border-bottom:1px solid var(--border)}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:rgba(91,140,255,.1)}
.search-result-qty{font-size:.74rem;color:var(--muted);margin-top:2px}
.footer-actions{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 20px;display:flex;gap:10px;z-index:20;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.counter{background:var(--primary);color:#fff;font-size:.7rem;font-weight:800;border-radius:20px;padding:1px 7px}
.add-item-wrap{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.filtros-row{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.filtro-grupo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filtro-label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);min-width:64px}
.filtro-chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:.76rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.chip:hover{border-color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.catalogo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px;max-height:400px;overflow-y:auto;padding:4px 2px}
.catalogo-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px;cursor:pointer;transition:.15s}
.catalogo-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.catalogo-card.added{border-color:var(--primary);background:rgba(91,140,255,.08)}
.catalogo-card.sem-estoque{opacity:.45;cursor:not-allowed}
.catalogo-card.added.maxed{cursor:not-allowed}
.catalogo-card .nome{font-weight:700;font-size:.82rem;margin-bottom:5px;line-height:1.25}
.catalogo-card .cat{font-size:.65rem;color:var(--primary);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;display:block}
.catalogo-card .qtd{font-size:.7rem;color:var(--muted)}
.catalogo-card .ok-tag{font-size:.68rem;color:var(--primary);font-weight:800;margin-top:5px}
.catalogo-empty{grid-column:1/-1;text-align:center;padding:20px;color:var(--muted);font-size:.85rem}
.eco-links{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 0}
.eco-links a{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;text-decoration:none}
.eco-links a:hover{color:var(--text);background:var(--surface-hover)}
</style>
<script src="/macroview-widget.js" defer></script>
</head>

<header>
  <a href="/index.html" style="text-decoration:none;display:flex;align-items:center;gap:10px">
    <svg width="55" height="15" viewBox="0 0 36.4 10.22" fill="currentColor" style="color:var(--text)">
      <rect x="16.96" y="0" width="2.47" height="10.22"/>
      <path d="M22.04,4.83V0h2.47v4.74c0,2.09.6,3.1,1.88,3.1s2.8-.77,4.53-2.03l2.98-2.06V0h2.5v10.22h-2.32c0-1.13,0-2.86.06-3.99-3.99,2.68-5.78,3.99-8.14,3.99-2.53,0-3.96-1.64-3.96-5.39"/>
      <path d="M14.36,5.39v4.83h-2.47v-4.74c0-2.09-.6-3.1-1.88-3.1s-2.8.77-4.53,2.03l-2.98,2.06v3.76H0V0h2.32c0,1.13,0,2.86-.06,3.99C6.26,1.31,8.05,0,10.4,0c2.53,0,3.96,1.64,3.96,5.39"/>

    <div>

<div class="page">

  <div class="section-label">Dados da OT</div>
  <div class="card">
    <div class="grid2" style="margin-bottom:12px">
      <div>
        <label>Número e nome da OT</label>
        <div style="display:flex;align-items:center;gap:6px">
          <span id="otPrefixo" style="color:var(--muted);font-weight:700;white-space:nowrap;font-size:.9rem"></span>
          <input id="otDigitos" maxlength="4" inputmode="numeric" placeholder="0057" style="width:64px;text-align:center;flex:none" disabled>
          <input id="otNome" placeholder="Ex: HNK NA" style="flex:1">
        </div>
        <div id="otNumMsg" style="color:var(--muted);font-size:.72rem;margin-top:4px"></div>
        <input id="otNum" type="hidden">
      </div>
      <div>
        <label>Data</label>
        <input id="otData" type="date">
      </div>
    </div>
    <div class="grid2" style="margin-bottom:12px">
      <div>
        <label>Solicitante *</label>
        <input id="otSolic" placeholder="Nome completo">
      </div>
      <div>
        <label>Setor</label>

    </div>

      <label>Local de uso / Obra</label>

  <div class="card" id="canalCard">

    <div class="canal-compose">

<script>
const API='/api';
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
// unidades "de peça" (contáveis, sempre inteiro) vs "de medida" (m, kg — aceitam fração)
const UNIDADES_CONTAVEIS=['un','pç','cx','rolo'];

// Esta página quase sempre é aberta numa aba nova (window.open a partir do painel), onde
// history.back() não tem pra onde voltar. Fecha a aba; se o navegador não deixar (ex: página
// aberta digitando a URL direto, não via script), cai pro histórico como alternativa.
function cancelarPagina(){
  window.close();
  history.back();
}
let itensEstoque=[], carrinho=[];

// preencher data de hoje
document.getElementById('otData').value=new Date().toISOString().slice(0,10);

document.getElementById('otPrefixo').textContent='OT-';

// Modo edição: ?editar=OT-2026-0037 reaproveita esta mesma tela (catálogo, filtros, item
// livre, etc.) pra editar uma OT já existente, em vez do modal simplificado do painel.
const otParaEditar = new URL(location.href).searchParams.get('editar');
const modoEdicao = !!otParaEditar;
let itensOriginais=[]; // solicitações já salvas no servidor, pra diff no salvar

async function init(){
  itensEstoque=await fetch(`${API}/itens`).then(r=>r.json()).catch(()=>[]);

  if(modoEdicao){
    document.getElementById('paginaTitulo').textContent='Editar OT';
    document.title='Editar OT · NIU Estoque';
    document.getElementById('otPrefixo').textContent=otParaEditar;
    document.getElementById('otDigitos').style.display='none';
    document.getElementById('otNum').value=otParaEditar;
    document.getElementById('btnGerarOt').textContent='Salvar e gerar PDF';

    const [projetos, itensOt] = await Promise.all([
      fetch(`${API}/projetos`).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/ot/${encodeURIComponent(otParaEditar)}`).then(r=>r.json()).catch(()=>[])
    ]);
    const projeto = projetos.find(p=>p.numero===otParaEditar);
    if(!projeto && !itensOt.length){
      document.getElementById('otNumMsg').textContent='OT não encontrada.'; document.getElementById('otNumMsg').style.color='var(--danger)';
    }
    document.getElementById('otNome').value = projeto?.nome || '';
    document.getElementById('otSetor').value = projeto?.setor || '';
    document.getElementById('otSolic').value = itensOt[0]?.solicitante || '';
    document.getElementById('otLocal').value = itensOt[0]?.local_uso || '';

    itensOriginais = itensOt;
    carrinho = itensOt.map(it=>{
      const estoqueItem = it.item_id ? itensEstoque.find(i=>i.id===it.item_id) : null;
      return {
        _id: it.item_id || ('x'+it.id),
        _solId: it.id,
        _origQty: it.quantidade,
        _estoque: !!it.item_id,
        nome: it.item_nome,
        qty: it.quantidade,
        unidade: it.unidade,
        local: it.local_uso||'',
        obs: '',
        maxQty: estoqueItem ? estoqueItem.quantidade + it.quantidade : undefined,
        modelo: it.item_modelo,
        voltagem: it.item_voltagem
      };
    });
  }

  renderFiltros();
  renderCatalogo();
  render();

  if(!modoEdicao){
    // reserva um número de projeto novo e único no servidor (evita colisão entre usuários simultâneos)
    const r=await fetch(`${API}/projetos`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).then(r=>r.json()).catch(()=>null);
    const digitos=document.getElementById('otDigitos');
    if(r?.numero){
      document.getElementById('otNum').value=r.numero;
      digitos.value=r.numero.split('-').pop();
      digitos.disabled=false;
    } else {
      document.getElementById('otNumMsg').textContent='Erro ao reservar número — recarregue a página.';
    }
  }
  carregarCanal();
}
init();

/* ===== CANAL (eventos automáticos + observações escritas por alguém, por OT) ===== */
let canalInterval=null;
function iniciaisDe(nome){
  const partes=(nome||'?').trim().split(/\s+/).filter(Boolean);
  if(!partes.length) return '?';
  return (partes[0][0]+(partes[1]?partes[1][0]:'')).toUpperCase();
}
function horaRelativaCanal(dataStr){
  const d=new Date(dataStr.replace(' ','T')+'Z');
  const diffMin=Math.round((Date.now()-d.getTime())/60000);
  if(diffMin<1) return 'agora';
  if(diffMin<60) return `há ${diffMin} min`;
  const diffH=Math.round(diffMin/60);
  if(diffH<24) return `há ${diffH}h`;
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
async function carregarCanal(){
  const ot=document.getElementById('otNum').value.trim();
  const feed=document.getElementById('canalFeed');
  const counter=document.getElementById('canalCounter');
  if(!ot){ feed.innerHTML='<div style="text-align:center;padding:16px;color:var(--muted);font-size:.82rem">Salve ou abra uma OT existente pra ver o canal.</div>'; return; }
  let eventos=[];
  try{ eventos=await fetch(`${API}/ot/${encodeURIComponent(ot)}/eventos`).then(r=>r.ok?r.json():[]); }catch(e){}
  counter.style.display='inline-block';
  counter.textContent=eventos.length;
  feed.innerHTML = eventos.length ? eventos.map(ev=>{
    if(ev.tipo==='mensagem'){
      return `<div class="canal-item mensagem">
        <div class="canal-avatar">${esc(iniciaisDe(ev.autor))}</div>
        <div class="canal-bubble"><span class="canal-autor">${esc(ev.autor||'Anónimo')}</span><span class="canal-hora">${horaRelativaCanal(ev.criado_em)}</span><div>${esc(ev.texto)}</div></div>
      </div>`;
    }
    return `<div class="canal-item evento">
      <div class="canal-avatar">•</div>
      <div><b>${esc(ot)}</b> ${esc(ev.texto)}${ev.autor&&ev.autor!=='Sistema'?' — '+esc(ev.autor):''} <span class="canal-hora">${horaRelativaCanal(ev.criado_em)}</span></div>
    </div>`;
  }).join('') : '<div style="text-align:center;padding:16px;color:var(--muted);font-size:.82rem">Nenhum evento ainda nesta OT.</div>';
  feed.scrollTop=feed.scrollHeight;
}
async function enviarMensagemCanal(){
  const ot=document.getElementById('otNum').value.trim();
  const input=document.getElementById('canalInput');
  const texto=input.value.trim();
  if(!ot){ await niuAlert('Salve a OT antes de escrever no canal.'); return; }
  if(!texto) return;
  input.value='';
  try{
    const r=await fetch(`${API}/ot/${encodeURIComponent(ot)}/eventos`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto})});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||'falha'); }
    await carregarCanal();
  }catch(e){ await niuAlert('Erro ao enviar: '+e.message); input.value=texto; }
}
document.getElementById('canalEnviar').addEventListener('click', enviarMensagemCanal);
document.getElementById('canalInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviarMensagemCanal(); }
});
if(!canalInterval) canalInterval=setInterval(carregarCanal, 15000);

document.getElementById('otDigitos').addEventListener('change', async e=>{

// busca estoque + filtros
const busca=document.getElementById('busca');
let filtroCatAtivo='', filtroModeloAtivo='', filtroVoltAtivo='';

function chipsHtml(vals, ativo, grupo){
  return `<button type="button" class="chip ${!ativo?'active':''}" data-grupo="${grupo}" data-valor="">Todas</button>` +
    vals.map(v=>`<button type="button" class="chip ${ativo===v?'active':''}" data-grupo="${grupo}" data-valor="${esc(v)}">${esc(v)}</button>`).join('');
}
function renderFiltros(){
  const base=itensEstoque.filter(i=>(!filtroCatAtivo||i.categoria===filtroCatAtivo));
  const cats=[...new Set(itensEstoque.map(i=>i.categoria).filter(Boolean))].sort();
  const modelos=[...new Set(base.map(i=>i.modelo).filter(Boolean))].sort();
  const volts=[...new Set(base.map(i=>i.voltagem).filter(Boolean))].sort();
  document.getElementById('filtrosCat').innerHTML = chipsHtml(cats, filtroCatAtivo, 'cat');
  document.getElementById('filtrosModelo').innerHTML = chipsHtml(modelos, filtroModeloAtivo, 'modelo');
  document.getElementById('filtrosVolt').innerHTML = chipsHtml(volts, filtroVoltAtivo, 'volt');

  document.getElementById('grupoVolt').style.display = volts.length ? '' : 'none';

document.getElementById('filtrosRow').addEventListener('click', e=>{
  const btn=e.target.closest('.chip'); if(!btn) return;
  const grupo=btn.dataset.grupo, valor=btn.dataset.valor;
  if(grupo==='cat'){ filtroCatAtivo=valor; filtroModeloAtivo=''; filtroVoltAtivo=''; }
  else if(grupo==='modelo') filtroModeloAtivo=valor;
  else if(grupo==='volt') filtroVoltAtivo=valor;
  renderFiltros();
  renderCatalogo();
});

function renderCatalogo(){
  const t=busca.value.toLowerCase().trim();
  const wrap=document.getElementById('catalogoGrid');
  const found=itensEstoque.filter(i=>
    (!t||i.nome.toLowerCase().includes(t)) &&
    (!filtroCatAtivo||i.categoria===filtroCatAtivo) &&
    (!filtroModeloAtivo||i.modelo===filtroModeloAtivo) &&
    (!filtroVoltAtivo||i.voltagem===filtroVoltAtivo)
  );
  if(!found.length){ wrap.innerHTML='<div class="catalogo-empty">Nenhum item encontrado.</div>'; return; }
  wrap.innerHTML=found.map(i=>{
    // o mesmo item pode ter uma linha em cada tema (ex: "Bucha" em Calhas E em Forro) —
    // o limite de estoque é compartilhado entre todas essas linhas, então soma tudo aqui
    // em vez de olhar só a primeira que achar
    const linhasDoItem=carrinho.filter(c=>c._id==i.id);
    const totalPedido=linhasDoItem.reduce((s,c)=>s+c.qty,0);
    const semEstoque=i.quantidade<=0;
    // maxQty já soma estoque livre + quantidade que essa mesma OT já tem reservada (modo edição);
    // pra itens novos ainda sem maxQty, o limite é só o estoque livre atual.
    const limite=linhasDoItem[0]?.maxQty ?? i.quantidade;
    const esgotadoNoCarrinho=linhasDoItem.length && totalPedido>=limite;
    const bloqueado=semEstoque||esgotadoNoCarrinho;
    return `
    <div class="catalogo-card ${linhasDoItem.length?'added':''} ${bloqueado&&!linhasDoItem.length?'sem-estoque':''} ${esgotadoNoCarrinho?'maxed':''}" ${!bloqueado?`onclick="adicionarDoEstoque(${i.id})"`:''}>
      <span class="cat">${esc(i.categoria)}</span>
      <div class="nome">${esc(i.nome)}</div>
      <div class="qtd">${semEstoque?'Sem estoque':`${i.quantidade} ${esc(i.unidade)} disponível`}</div>
      ${linhasDoItem.length?`<div class="ok-tag">✓ ${totalPedido} no pedido${!bloqueado?' · clique pra +1':''}</div>`:''}
    </div>`;
  }).join('');
}
busca.addEventListener('input', renderCatalogo);

async function adicionarDoEstoque(id){
  const it=itensEstoque.find(i=>i.id==id);
  if(!it) return;
  // uma linha de carrinho por (item, tema) — o mesmo item pode aparecer em temas diferentes,
  // mas o limite de estoque é compartilhado entre todas as linhas dele, não por linha
  const linhasDoItem=carrinho.filter(c=>c._id==id);
  const limite=linhasDoItem[0]?.maxQty ?? it.quantidade;
  const totalPedido=linhasDoItem.reduce((s,c)=>s+c.qty,0);
  if(totalPedido>=limite){ await niuAlert('Quantidade em estoque esgotada.'); return; }
  const existente=linhasDoItem.find(c=>(c.local||'')===(temaAtivo||''));
  if(existente){
    existente.qty++;
  } else {
    carrinho.push({_id:id,_estoque:true,nome:it.nome,qty:1,unidade:it.unidade,local:temaAtivo,obs:'',maxQty:it.quantidade,modelo:it.modelo,voltagem:it.voltagem});
  }
  renderCatalogo();
  render();
}

        <div>

        </div>
        <div>
          <label>Unidade</label>
          <select onchange="carrinho[${i}].unidade=this.value;ajustarQty(${i},carrinho[${i}].qty);render()">
            ${['un','m','cx','rolo','pç','kg'].map(u=>`<option ${u===c.unidade?'selected':''}>${u}</option>`).join('')}
          </select>

        </div>

function adicionarItemExtraNoTema(tema){
  carrinho.push({_id:'x'+Date.now(),_estoque:false,nome:'',qty:1,unidade:'un',local:tema||'',obs:''});
  temasVazios=temasVazios.filter(t=>t!==tema);

  render();

function definirTemaAtivo(t){ temaAtivo=t||''; render(); }
let temasRecolhidos=new Set();
let temasVazios=[];
let itemArrastadoIdx=null;
let temaAtivo='';
function toggleTema(chave){
  if(temasRecolhidos.has(chave)) temasRecolhidos.delete(chave); else temasRecolhidos.add(chave);
  render();
}
function renomearTema(chaveAntiga){
  const novoNome=prompt('Renomear tema "'+chaveAntiga+'" para:',chaveAntiga);
  if(novoNome===null) return;
  const novo=novoNome.trim();
  carrinho.forEach(c=>{ if((c.local||'').trim()===chaveAntiga) c.local=novo; });
  temasVazios=temasVazios.map(t=>t===chaveAntiga?novo:t);
  if(temasRecolhidos.has(chaveAntiga)){ temasRecolhidos.delete(chaveAntiga); temasRecolhidos.add(novo); }
  if(temaAtivo===chaveAntiga) temaAtivo=novo;
  render();
}
function criarTema(){
  const nome=prompt('Nome do novo tema/capítulo (ex: GREY GOOSE, ST GERMAIN):');
  if(!nome) return;
  const t=nome.trim();
  if(!t) return;
  if(!temasVazios.includes(t)) temasVazios.push(t);
  temaAtivo=t;
  render();
}
function removerTemaVazio(chave){
  temasVazios=temasVazios.filter(t=>t!==chave);
  if(temaAtivo===chave) temaAtivo='';
  render();
}
function iniciarArrasto(i,event){
  // clique começou dentro de um campo de digitar (ex: selecionando texto) — não é uma
  // tentativa de mover o item pra outro tema, cancela o arrasto da linha inteira
  const alvo=event?.target;
  if(alvo&&(alvo.tagName==='INPUT'||alvo.tagName==='TEXTAREA'||alvo.tagName==='SELECT')){ event.preventDefault(); return; }
  itemArrastadoIdx=i;
}
function soltarNoTema(ev,chave){
  ev.preventDefault();
  if(itemArrastadoIdx===null) return;
  carrinho[itemArrastadoIdx].local=chave;
  itemArrastadoIdx=null;
  render();
}
function render(){
  document.getElementById('counter').textContent=carrinho.length;
  const indEl=document.getElementById('temaAtivoIndicator');
  if(indEl){
    indEl.innerHTML=temaAtivo
      ? `<div class="tema-ativo-chip">Adicionando itens em: <b>${esc(temaAtivo)}</b> <button type="button" onclick="definirTemaAtivo('')" title="Parar de adicionar neste tema">✕</button></div>`
      : '';
  }
  const listEl=document.getElementById('itensList');
  const grupos=[]; const grupoIdx={};
  carrinho.forEach((c,i)=>{
    const chave=(c.local||'').trim();
    if(!(chave in grupoIdx)){ grupoIdx[chave]=grupos.length; grupos.push({chave,idxs:[]}); }
    grupos[grupoIdx[chave]].idxs.push(i);
  });
  temasVazios.forEach(t=>{ if(!(t in grupoIdx)){ grupoIdx[t]=grupos.length; grupos.push({chave:t,idxs:[]}); } });
  grupos.sort((a,b)=>a.chave===''?-1:b.chave===''?1:0);
  if(!grupos.length){
    listEl.innerHTML='<div style="text-align:center;padding:24px;color:var(--muted);font-size:.9rem;background:var(--surface);border:1px dashed var(--border);border-radius:14px">Nenhum item adicionado. Use a busca acima, adicione um item livre, ou crie um tema/capítulo.</div>';
    return;
  }
  listEl.innerHTML=grupos.map(g=>{
    const corpo=g.idxs.length
      ? g.idxs.map(i=>itemRowHtml(carrinho[i],i)).join('')
      : (g.chave?'<div class="tema-vazio-hint">Arraste um item pra cá, ou use "＋ item neste tema"</div>':'');
    if(!g.chave){
      return `<div class="tema-body" ondragover="event.preventDefault()" ondrop="soltarNoTema(event,'')">${corpo}</div>`;
    }
    const recolhido=temasRecolhidos.has(g.chave);
    const chaveJs=esc(g.chave).replace(/'/g,"\\'");
    const header=`<div class="tema-header" ondragover="event.preventDefault()" ondrop="soltarNoTema(event,'${chaveJs}')">
      <span class="tema-toggle" onclick="toggleTema('${chaveJs}')" style="cursor:pointer">${recolhido?'▸':'▾'} ${esc(g.chave)}</span>
      <span class="tema-count">${g.idxs.length} ${g.idxs.length===1?'item':'itens'}</span>
      <button type="button" class="tema-add-btn" onclick="renomearTema('${chaveJs}')" title="Renomear este tema (atualiza todos os itens dele)">✎ renomear</button>
      ${!g.idxs.length?`<button type="button" class="tema-add-btn" onclick="removerTemaVazio('${chaveJs}')" title="Remover este tema vazio">✕ remover</button>`:''}
      <button type="button" class="tema-add-btn" onclick="adicionarItemExtraNoTema('${chaveJs}')">＋ item neste tema</button>
    </div>`;
    const corpoHtml=recolhido?'':`<div class="tema-body" ondragover="event.preventDefault()" ondrop="soltarNoTema(event,'${chaveJs}')">${corpo}</div>`;
    return header + corpoHtml;
  }).join('') + '<div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="button" class="btn btn-ghost" onclick="criarTema()" style="padding:8px 14px">＋ Novo tema / capítulo</button></div>';
  const temas=[...new Set([...carrinho.map(c=>(c.local||'').trim()),...temasVazios].filter(Boolean))];
  const dl=document.createElement('datalist');
  dl.id='temasList';
  dl.innerHTML=temas.map(t=>`<option value="${esc(t)}">`).join('');
  listEl.appendChild(dl);
}
function renderNome(i,v){
  const el=document.querySelector(`#itensList .item-row[data-idx="${i}"] .item-nome-display`);
  if(el) el.innerHTML=v||'<span style="color:var(--muted);font-weight:400">Novo item</span>'+'<span class="tag-extra">Item livre</span>';

let confirmarEmAndamento=false;
async function confirmar(apenasEmail=false){
  if(confirmarEmAndamento) return;
  const ot=document.getElementById('otNum').value.trim();
  const solic=document.getElementById('otSolic').value.trim();
  const local=document.getElementById('otLocal').value.trim();
  const email=document.getElementById('otEmail').value.trim();
  if(!ot||!solic){await niuAlert('Preencha número da OT e solicitante.');return;}
  if(!carrinho.length){await niuAlert('Adicione pelo menos um item.');return;}
  if(carrinho.some(c=>!c.nome.trim())){await niuAlert('Preencha o nome de todos os itens.');return;}
  if(apenasEmail&&!email){await niuAlert('Preencha o email de destino.');return;}

  const setor=document.getElementById('otSetor').value.trim();
  const obs=document.getElementById('otObs').value.trim();
  const data=document.getElementById('otData').value;
  const nomeOt=document.getElementById('otNome').value.trim();

  confirmarEmAndamento=true;
  const btnEmail=document.getElementById('btnEmail'), btnOt=document.getElementById('btnGerarOt');
  btnEmail.disabled=true; btnOt.disabled=true;
  try{
    const rProjeto=await fetch(`${API}/projetos/${encodeURIComponent(ot)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({setor,nome:nomeOt,solicitante:solic})});
    if(!rProjeto.ok){ await niuAlert('Erro ao salvar dados da OT.'); return; }

    // Diff sempre contra o que já foi salvo nesta sessão (itensOriginais começa vazio na
    // criação, e vai sendo preenchido conforme salva) — assim clicar em "Enviar email" e
    // depois em "Gerar PDF" não registra os mesmos itens novos duas vezes.
    const origPorId={}; itensOriginais.forEach(o=>origPorId[o.id]=o);
    const idsAtuais=new Set(carrinho.filter(c=>c._solId).map(c=>c._solId));

    // remove itens que saíram do carrinho (devolve ao estoque automaticamente)
    for(const orig of itensOriginais){
      if(!idsAtuais.has(orig.id)){
        const rDel=await fetch(`${API}/solicitacoes/${orig.id}`,{method:'DELETE'});
        if(!rDel.ok){ await niuAlert('Erro ao remover um item da OT.'); return; }
      }
    }
    itensOriginais=itensOriginais.filter(o=>idsAtuais.has(o.id));

    // atualiza itens já registrados que mudaram (quantidade, local ou nome do item livre)
    for(const c of carrinho.filter(c=>c._solId)){
      const orig=origPorId[c._solId];
      const localNovo=c.local||local;
      if(c.qty!==orig.quantidade || localNovo!==(orig.local_uso||'') || (!c._estoque && c.nome!==orig.item_nome)){
        const rPatch=await fetch(`${API}/solicitacoes/${c._solId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          quantidade:c.qty, local_uso:localNovo, item_nome:c._estoque?undefined:c.nome
        })});
        if(!rPatch.ok){ const e=await rPatch.json().catch(()=>({})); await niuAlert('Erro ao atualizar item: '+(e.error||'')); return; }
        orig.quantidade=c.qty; orig.local_uso=localNovo; if(!c._estoque) orig.item_nome=c.nome;
        c._origQty=c.qty;
      }
    }
    // insere só os itens que ainda não foram registrados (novos ou recém-adicionados)
    const novos=carrinho.filter(c=>!c._solId);
    if(novos.length){
      const r=await fetch(`${API}/solicitacoes/lote`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        ot,solicitante:solic,setor,
        itens:novos.map(c=>c._estoque
          ? {itemId:c._id,quantidade:c.qty,localUso:c.local||local}
          : {itemId:null,nome:c.nome,unidade:c.unidade,quantidade:c.qty,localUso:c.local||local})
      })});
      if(!r.ok){const e=await r.json().catch(()=>({}));await niuAlert('Erro: '+(e.error||'falha ao registar itens novos'));return;}
      const dataResp=await r.json().catch(()=>({}));
      (dataResp.ids||[]).forEach((id,i)=>{
        if(id==null) return;
        const c=novos[i];
        c._solId=id; c._origQty=c.qty;
        itensOriginais.push({id, item_id:c._estoque?c._id:null, item_nome:c.nome, quantidade:c.qty, local_uso:c.local||local, status:'pendente'});
      });
    }

    if(apenasEmail&&email){
      // enviar por email via worker
      const linhas=carrinho.map(c=>`<tr><td style="padding:6px;border-bottom:1px solid #eee">${c.nome}</td><td style="padding:6px;border-bottom:1px solid #eee">${c.qty} ${c.unidade}</td><td style="padding:6px;border-bottom:1px solid #eee">${c.local||local||'—'}</td></tr>`).join('');
      const rEmail=await fetch(`/api/ot/email`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        to:email, ot, nome:nomeOt, solic, setor, local, obs, data, linhas,
        url:`${location.origin}/ot.html?ot=${encodeURIComponent(ot)}`
      })});
      if(rEmail.ok){
        await niuAlert(`${ot} enviada para ${email}`);
      } else {
        const e=await rEmail.json().catch(()=>({}));
        await niuAlert('Erro ao enviar email: '+(e.error||'verifique a configuração do Resend no servidor.'));
      }
    } else {
      gerarPDF({ot,nome:nomeOt,solic,setor,local,obs,data});
    }
  } finally {
    confirmarEmAndamento=false;
    btnEmail.disabled=false; btnOt.disabled=false;
  }
}

// Unidades "de peça" (contáveis) geram uma etiqueta por unidade física (ex: 5 transformadores
// = 5 etiquetas, cada uma marcada 1/5, 2/5...). Unidades de medida contínua (m, kg) geram só
// uma etiqueta pro item inteiro — não faz sentido uma etiqueta por metro de cabo.
// (UNIDADES_CONTAVEIS já declarada no topo do script, reaproveitada aqui)
// expande o carrinho em uma etiqueta por unidade física (5 transformadores = 5 entradas,
// marcadas 1/5, 2/5...); unidades de medida contínua (m, kg) ficam com etiqueta única.
function montarLabelsItens(ot,nomeOt,local){
  const labels=[];
  // mesmo link da etiqueta de QR dedicada, mas em toda etiqueta de item também (cabeçalho,
  // em tamanho menor) — essas OTs são reais (criadas aqui no Dashboard), então aponta pro
  // resumo de verdade com status de cada item, não pro resumo genérico do print-agent
  const qrResumoUrl = ot ? `${location.origin}/ot-resumo.html?ot=${encodeURIComponent(ot)}` : null;
  carrinho.forEach(c=>{
    const total=UNIDADES_CONTAVEIS.includes(c.unidade)?Math.max(1,Math.round(c.qty)):1;
    for(let i=1;i<=total;i++){
      labels.push({ot,nomeOt,nome:c.nome,local:c.local||local,obs:c.obs,unitIdx:i,unitTotal:total,qrResumoUrl});
    }
  });
  return labels;
}
function validarParaEtiquetas(){
  const ot=document.getElementById('otNum').value.trim();
  if(!ot) return {erro:'Aguarde o número da OT ser reservado antes de gerar etiquetas.'};
  if(!carrinho.length) return {erro:'Adicione pelo menos um item antes de gerar etiquetas.'};
  if(carrinho.some(c=>!c.nome.trim())) return {erro:'Preencha o nome de todos os itens.'};
  return {
    ot, nomeOt:document.getElementById('otNome').value.trim(),
    local:document.getElementById('otLocal').value.trim()
  };
}
async function gerarEtiquetas(){
  const v=validarParaEtiquetas();
  if(v.erro){await niuAlert(v.erro);return;}
  const {ot,nomeOt,local}=v;
  const itens=montarLabelsItens(ot,nomeOt,local);
  const labels=[{tipoQr:true,ot,nomeOt,url:`${location.origin}/ot-resumo.html?ot=${encodeURIComponent(ot)}`},...itens];
  await imprimirEtiquetaTermica(labels,`etiquetas-${ot}.pdf`);

  // registra na fila de impressão térmica (preparação pra automação futura — não bloqueia
  // a geração do PDF se falhar, é só um registro auxiliar)
  fetch(`${API}/etiquetas/fila`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    ot, nomeProjeto:nomeOt,
    itens:itens.map(l=>({nome:l.nome,local:l.local,obs:l.obs,unitIdx:l.unitIdx,unitTotal:l.unitTotal}))
  })}).catch(()=>{});
}
// IP direto (não hostname mDNS) da máquina onde o print-agent roda, conectada à impressora
// por USB. Essa máquina tem Ethernet E Wi-Fi ativos ao mesmo tempo, em sub-redes
// diferentes — o hostname "Douglas-Studio-2.local" (mDNS) respondia com um IP que outros
// computadores na rede não conseguiam alcançar (ERR_ADDRESS_UNREACHABLE), então trocamos
// pro IP da rede Wi-Fi, que é a que os outros dispositivos realmente usam.
// ATENÇÃO: esse IP vem de DHCP e pode mudar se o roteador reatribuir o endereço (reboot da
// máquina, do roteador, etc) — o ideal é reservar esse IP fixo pra essa máquina nas
// configurações do roteador; sem isso, esse link pode voltar a quebrar mais cedo ou tarde.
const PRINT_AGENT_URL = 'http://192.168.23.185:4000';

async function enviarParaZebra(){
  const v=validarParaEtiquetas();
  if(v.erro){await niuAlert(v.erro);return;}
  const {ot,nomeOt}=v;
  // não usa montarLabelsItens aqui — aquele já expande em uma entrada por unidade física
  // (unitIdx/unitTotal), mas a fila do print-agent guarda por item com quantidade (é o
  // próprio servidor que expande na hora de gerar o PDF), então manda no formato dele.
  const itens=carrinho.map(c=>({
    nome:c.nome,
    local:c.local||v.local,
    obs:c.obs||'',
    quantidade:UNIDADES_CONTAVEIS.includes(c.unidade)?Math.max(1,Math.round(c.qty)):1
  }));
  const json = JSON.stringify({ot,nomeOt,itens});
  const dados = btoa(unescape(encodeURIComponent(json))); // base64 seguro pra UTF-8 (acentos)
  // <a> clicado é tratado como navegação de verdade pelo navegador — window.open() direto
  // às vezes cai no bloqueador de pop-up dependendo do contexto do clique
  const link = document.createElement('a');
  link.href = `${PRINT_AGENT_URL}/?dados=${encodeURIComponent(dados)}`;
  link.target = '_blank';
  link.rel = 'noopener';
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function gerarPDF({ot,nome,solic,setor,local,obs,data}){
  gerarFolhaRequisicaoPDF({
    ot, nome, solicitante: solic, setor, local, data, obs,
    itens: carrinho.map(c=>({ nome: c.nome, qtd: c.qty, unidade: c.unidade, local: c.local, obs: c.obs, modelo: c.modelo, voltagem: c.voltagem }))
  });
}

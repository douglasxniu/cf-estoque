<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pesquisa de Transportes · Estoque</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="/theme.js"></script>
<script src="/dialogs.js"></script>
<link rel="stylesheet" href="/theme.css">
<script src="/auth-gate.js"></script>
<style>
:root{--brd:var(--border);--r:16px}
*{margin:0;padding:0}
body{font-size:14.5px;min-height:100vh;padding:12px 12px 60px}
.wrap{max-width:680px;margin:0 auto}
.g{background:var(--surface);border:1px solid var(--brd);border-radius:var(--r);backdrop-filter:blur(10px) saturate(130%);box-shadow:var(--shadow-card)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
header a{text-decoration:none;display:flex;align-items:center;gap:10px}
.sub{font-size:.75rem;color:var(--muted)}
.eco-links{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.eco-links a{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:600;color:var(--muted);background:var(--surface-hover);border:1px solid var(--brd);border-radius:8px;padding:5px 9px;text-decoration:none}
.eco-links a:hover{color:var(--text)}
.card{padding:16px 18px;margin-bottom:12px}
.search-row{display:flex;gap:8px}
input{flex:1;padding:12px 14px;border:1px solid var(--brd);border-radius:10px;background:var(--surface-2);color:var(--text);font-size:.95rem;font-family:inherit}
input:focus{outline:none;border-color:var(--primary)}
input::placeholder{color:var(--muted-2)}
.hint{font-size:.72rem;color:var(--muted);margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:.88rem}
.resultado-card{padding:14px 16px;margin-bottom:10px;text-decoration:none;display:block;color:inherit}
.resultado-card:hover{border-color:var(--primary)}
.res-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.res-guia{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:.85rem;color:var(--primary)}
.res-data{font-size:.72rem;color:var(--muted)}
.res-ot{font-size:.8rem;font-weight:700;margin-bottom:6px}
.res-itens{display:flex;flex-direction:column;gap:2px}
.res-item{font-size:.8rem;color:var(--text)}
.res-item span{color:var(--muted);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.72rem}
.res-meta{font-size:.72rem;color:var(--muted);margin-top:6px}
.res-mais{font-size:.72rem;color:var(--muted-2);font-style:italic;margin-top:2px}
.spin{width:14px;height:14px;border:2px solid var(--brd);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <a href="/index.html">
    <svg width="70" height="20" viewBox="0 0 36.4 10.22" fill="currentColor" style="color:var(--text)">
      <rect x="16.96" y="0" width="2.47" height="10.22"/>
      <path d="M22.04,4.83V0h2.47v4.74c0,2.09.6,3.1,1.88,3.1s2.8-.77,4.53-2.03l2.98-2.06V0h2.5v10.22h-2.32c0-1.13,0-2.86.06-3.99-3.99,2.68-5.78,3.99-8.14,3.99-2.53,0-3.96-1.64-3.96-5.39"/>
      <path d="M14.36,5.39v4.83h-2.47v-4.74c0-2.09-.6-3.1-1.88-3.1s-2.8.77-4.53,2.03l-2.98,2.06v3.76H0V0h2.32c0,1.13,0,2.86-.06,3.99C6.26,1.31,8.05,0,10.4,0c2.53,0,3.96,1.64,3.96,5.39"/>
    </svg>
    <div><div style="font-weight:800;color:var(--text);font-size:.95rem">Prepress</div><div class="sub">Pesquisa de Transportes</div></div>
  </a>
  <button class="theme-toggle" title="Alternar tema" aria-label="Alternar tema claro/escuro">
    <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</header>

<div class="eco-links">
  <a href="/nova-ot.html" title="Nova OT">➕ Nova OT</a>
  <a href="/scan.html" title="Leitor QR">🔲 Leitor QR</a>
  <a href="/checkout.html" title="Checkout de Entrega">📦 Checkout</a>
  <a href="#" onclick="abrirMacroView();return false" title="Visão cruzada de uma OT">🔭 MacroView</a>
</div>

<div class="card g">
  <div class="search-row">
    <input id="buscaInput" placeholder="OT, nome da peça ou nº de série..." autocomplete="off">
  </div>
  <div class="hint">Pesquisa entre todas as ordens de transporte já emitidas — por número de OT, nome da peça ou série. Digite pelo menos 2 caracteres.</div>
</div>

<div id="resultado"></div>

</div>

<script src="https://estoque.niupt.workers.dev/macroview-widget.js" defer></script>
<script>
const API='/api';
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
function otParaExibicao(bruto){
  const t=String(bruto||'').trim();
  const m=t.match(/^OT-(\d{4})-(\d{1,6})$/i);
  return m?`OT-${m[2]}`:t;
}

let debounceTimer=null;
document.getElementById('buscaInput').addEventListener('input', ()=>{
  clearTimeout(debounceTimer);
  const q=document.getElementById('buscaInput').value.trim();
  const resEl=document.getElementById('resultado');
  if(q.length<2){ resEl.innerHTML=''; return; }
  resEl.innerHTML='<div class="card g"><div class="empty"><span class="spin"></span>Buscando...</div></div>';
  debounceTimer=setTimeout(()=>buscar(q), 250);
});

async function buscar(q){
  const resEl=document.getElementById('resultado');
  const r=await fetch(`${API}/checkout/buscar?q=${encodeURIComponent(q)}`).then(r=>r.json()).catch(()=>({resultados:[]}));
  const lista=r.resultados||[];
  if(!lista.length){ resEl.innerHTML='<div class="card g"><div class="empty">Nenhuma ordem de transporte encontrada.</div></div>'; return; }
  resEl.innerHTML=lista.map(g=>{
    const data=new Date(g.criadoEm.replace(' ','T')+'Z').toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'});
    const itensMostrados=g.itensBatidos.slice(0,4);
    const restante=g.totalItens-itensMostrados.length;
    return `<a class="card g resultado-card" href="/ordem-transporte.html?id=${g.id}">
      <div class="res-top">
        <span class="res-guia">ORDEM Nº${String(g.id).padStart(6,'0')}</span>
        <span class="res-data">${data}</span>
      </div>
      ${g.ot?`<div class="res-ot">${esc(otParaExibicao(g.ot))}</div>`:''}
      <div class="res-itens">
        ${itensMostrados.map(i=>`<div class="res-item">${esc(i.nome)} <span>×${i.quantidade||1}</span></div>`).join('')}
      </div>
      ${restante>0?`<div class="res-mais">+ ${restante} peça(s) nesta ordem</div>`:''}
      <div class="res-meta">Retirado por ${esc(g.retiradoPor||'—')} · ${g.totalItens} peça(s) ao todo</div>
    </a>`;
  }).join('');
}
</script>
</body>
</html>

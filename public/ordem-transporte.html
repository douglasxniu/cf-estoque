<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordem de Transporte · NIU Estoque</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<style>
:root{ --glass:var(--surface); --glass-brd:var(--border); --radius:16px; }
body{margin:0;min-height:100vh;font-size:15px;padding:20px 14px 40px}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius);backdrop-filter:blur(10px) saturate(130%);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-card)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
.brand-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.brand .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.titulo{font-size:1.3rem;font-weight:800}
.sub{color:var(--muted);font-size:.82rem;margin-top:2px}
.meta-row{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:.82rem}
.meta-row .lbl{color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.meta-row .val{font-weight:700;margin-top:2px}
.secao-lbl{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
th,td{padding:9px 4px;border-bottom:1px solid var(--border);text-align:left}
.obs{font-size:.76rem;color:var(--muted);font-style:italic;margin-top:2px}
th{color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:.9rem}
.footer{text-align:center;color:var(--muted);font-size:.68rem;margin-top:18px}
.btn-row{display:flex;gap:8px;margin-top:22px}
.btn-print,.btn-enviar{flex:1;border:none;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-print{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.btn-enviar{background:var(--surface-2,var(--surface));color:var(--text);border:1px solid var(--border)}
.btn-print svg,.btn-enviar svg{width:16px;height:16px;flex-shrink:0}
@media print{
  body{padding:0;background:#fff;color:#000}
  .brand,.btn-row,.theme-toggle,.footer{display:none!important}
  .card{box-shadow:none;border:1px solid #ccc}
}

/* ---- modal "Enviar para o telemóvel" — mesma ideia do recurso do Google/Chrome ---- */
.modal-fundo{display:none;position:fixed;inset:0;background:rgba(8,9,13,.6);backdrop-filter:blur(2px);z-index:900;align-items:center;justify-content:center;padding:20px}
.modal-fundo.aberto{display:flex}
.modal-qr{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;max-width:320px;width:100%;text-align:center;box-shadow:var(--shadow-card,0 12px 32px -14px rgba(0,0,0,.55))}
.modal-qr h3{margin:0 0 4px;font-size:1rem;font-weight:800}
.modal-qr p{margin:0 0 18px;font-size:.78rem;color:var(--muted)}
.modal-qr canvas{border-radius:10px;background:#fff;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.modal-qr .fechar{margin-top:16px;width:100%;border:1px solid var(--border);background:var(--surface-2,var(--surface));color:var(--text);border-radius:10px;padding:10px;font-weight:700;cursor:pointer;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-label"><span class="dot"></span> NIU Experience Agency · Ordem de Transporte</div>
    <button class="theme-toggle" title="Alternar tema" aria-label="Alternar tema claro/escuro">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>
  <div id="app"><div class="card"><div class="empty">A carregar...</div></div></div>
  <div class="footer"><a href="/" style="color:inherit">NIU Experience Agency · Sistema de Estoque</a></div>
</div>

<div class="modal-fundo" id="modalQr">
  <div class="modal-qr">
    <h3>Enviar para o telemóvel</h3>
    <p>Aponte a câmera do telemóvel pra este QR — a mesma ordem abre direto no navegador dele.</p>
    <canvas id="qrCanvas"></canvas>
    <button class="fechar" onclick="document.getElementById('modalQr').classList.remove('aberto')">Fechar</button>
  </div>
</div>

<script src="/vendor/qrcode.js"></script>
<script>
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
function otParaExibicao(bruto){
  const t=String(bruto||'').trim();
  const m=t.match(/^OT-(\d{4})-(\d{1,6})$/i);
  return m?`OT-${m[2]}`:t;
}

(async function () {
  const app = document.getElementById('app');
  const id = new URL(location.href).searchParams.get('id');
  if (!id) { app.innerHTML = '<div class="card empty">Ordem não informada.</div>'; return; }

  let dados;
  try {
    const res = await fetch(`/api/checkout/${encodeURIComponent(id)}`);
    if (!res.ok) { app.innerHTML = '<div class="card empty">Ordem não encontrada.</div>'; return; }
    dados = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="card empty">Não foi possível carregar a ordem agora.</div>';
    return;
  }

  const data = new Date(dados.criadoEm.replace(' ', 'T') + 'Z').toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  app.innerHTML = `
    <div class="card">
      <div class="titulo">Ordem de Transporte #${dados.id}</div>
      <div class="sub">${dados.ot ? 'OT ' + esc(otParaExibicao(dados.ot)) + (dados.nomeOt ? ' — ' + esc(dados.nomeOt) : '') : 'Peças de OTs diferentes — ver detalhe por item abaixo'}</div>
      <div class="meta-row">
        <div><div class="lbl">Retirado por</div><div class="val">${esc(dados.retiradoPor || '—')}</div></div>
        <div><div class="lbl">Emitida em</div><div class="val">${data}</div></div>
      </div>
      <div class="secao-lbl">Peças para transporte</div>
      <table>
        <thead><tr><th>Peça</th><th>Quantidade</th></tr></thead>
        <tbody>
          ${dados.itens.map(i => `<tr><td>${esc(i.nome)}${i.obs?`<div class="obs">${esc(i.obs)}</div>`:''}</td><td>${i.quantidade||1}</td></tr>`).join('')}
        </tbody>
      </table>
      ${dados.destinoLat!=null && dados.destinoLng!=null ? `
      <div class="secao-lbl">Endereço de entrega</div>
      <div class="val" style="margin-top:10px;margin-bottom:8px">${esc(dados.destinoEndereco || '—')}</div>
      <img src="/api/mapa-estatico?lat=${dados.destinoLat}&lng=${dados.destinoLng}&zoom=${dados.destinoZoom||16}&w=960&h=490" alt="Mapa do endereço de entrega, com pin" style="width:100%;border-radius:10px;border:1px solid var(--border);display:block">
      ${(dados.destinoPontos||[]).length ? `
      <div style="margin-top:10px">
        <div class="lbl" style="margin-bottom:5px">Pontos de referência</div>
        <ul style="margin:0;padding-left:18px;font-size:.82rem">${dados.destinoPontos.map(p=>`<li style="margin-bottom:3px">${esc(p)}</li>`).join('')}</ul>
      </div>` : ''}
      ` : ''}
      <div class="btn-row">
        <button class="btn-print" onclick="window.print()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Imprimir ordem
        </button>
        <button class="btn-enviar" onclick="abrirModalQr()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
          Enviar para o telemóvel
        </button>
      </div>
    </div>
  `;
})();

// gera o QR da própria URL (a mesma página que já está aberta) — igual ao recurso "Enviar
// para o telemóvel" do Google/Chrome: escanear abre exatamente esta guia no navegador do
// telemóvel, sem precisar digitar nada. Reaproveita a lib qrcode.js já usada no PDF.
function abrirModalQr(){
  const canvas = document.getElementById('qrCanvas');
  const qrObj = qrcode(0, 'M');
  qrObj.addData(location.href);
  qrObj.make();
  const mc = qrObj.getModuleCount(), cell = 7;
  canvas.width = canvas.height = mc * cell;
  const ctx = canvas.getContext('2d');
  for (let r = 0; r < mc; r++) for (let c = 0; c < mc; c++) { ctx.fillStyle = qrObj.isDark(r, c) ? '#000' : '#fff'; ctx.fillRect(c * cell, r * cell, cell, cell); }
  document.getElementById('modalQr').classList.add('aberto');
}
document.getElementById('modalQr').addEventListener('click', e => { if (e.target.id === 'modalQr') e.currentTarget.classList.remove('aberto'); });
</script>
</body>
</html>
